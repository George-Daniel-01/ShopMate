name: Database Backup

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BACKUP_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: pg_dump production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          host=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:/]+).*|\1|')
          port=$(echo "$DATABASE_URL" | sed -E 's|.*@[^:]+:([0-9]+).*|\1|')
          db=$(echo "$DATABASE_URL" | sed -E 's|.*/([^?]+).*|\1|')
          user=$(echo "$DATABASE_URL" | sed -E 's|.*://([^:]+):.*|\1|')
          pass=$(echo "$DATABASE_URL" | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|')
          date_stamp=$(date -u +'%Y%m%d-%H%M')
          mkdir -p "backups/$date_stamp"
          docker run --rm \
            -e PGPASSWORD="$pass" \
            -v "$PWD/backups/$date_stamp":/out \
            postgres:17 \
            pg_dump -h "$host" -p "$port" -U "$user" -d "$db" \
              --no-owner --no-privileges -f /out/dump.sql
          echo "backup_path=backups/$date_stamp" >> "$GITHUB_ENV"

      - name: Push backup to private repo
        env:
          BACKUP_PATH: ${{ env.backup_path }}
        run: |
          git clone git@github.com:George-Daniel-01/ShopMate-backups.git backup-repo
          cd backup-repo
          git config user.name "shopmate-backup-bot"
          git config user.email "backup@shopmate.invalid"
          mkdir -p backups
          cp -r "$GITHUB_WORKSPACE/$BACKUP_PATH" backups/
          git add -A
          git commit -m "backup: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "Pushed to George-Daniel-01/ShopMate-backups"
